name: Draft release

# Builds the AppImage for the version in tauri.conf.json and attaches it to a draft
# release. Apps only see an update once the draft is published.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft-release:
    # The oldest supported runner, so the AppImage runs on older systems too.
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config file libgtk-3-dev \
            libwebkit2gtk-4.1-dev libdbus-1-dev libayatana-appindicator3-dev

      - name: Update Rust
        run: rustup update stable && rustup default stable

      - name: Read the version
        id: version
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          tag="v$version"
          is_draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$is_draft" = false ]; then
            echo "::error::$tag is already published. Bump the version first."
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "is_draft=$is_draft"
          } >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          TAURI_LINUX_AYATANA_APPINDICATOR: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run build -- --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Prepare release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          bundle=src-tauri/target/release/bundle/appimage
          name="A50-Control_${VERSION}_amd64.AppImage"
          mkdir dist
          cp "$bundle/A50 Control_${VERSION}_amd64.AppImage" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          jq -n \
            --arg version "$VERSION" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat "$bundle/A50 Control_${VERSION}_amd64.AppImage.sig")" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$name" \
            '{version: $version, pub_date: $date, platforms: {"linux-x86_64": {signature: $signature, url: $url}}}' \
            > dist/latest.json

      - name: Create or refresh the draft
        env:
          TAG: ${{ steps.version.outputs.tag }}
          IS_DRAFT: ${{ steps.version.outputs.is_draft }}
        run: |
          if [ "$IS_DRAFT" = true ]; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --title "A50 Control $TAG" \
              --target "$GITHUB_SHA" --generate-notes
          fi
